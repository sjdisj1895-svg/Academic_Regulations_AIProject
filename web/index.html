<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>경상국립대학교 규정 통합 검색</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="brand">
      <span class="brand-badge">GNU</span>
      <span class="brand-title">경상국립대학교 규정 통합 검색</span>
    </div>
    <div class="brand-sub">대학 규정 + 산학협력단 규정을 한 번에 검색하세요</div>
  </div>
</header>

<main class="container">

  <!-- 검색창 영역 -->
  <section class="search-section">
    <!-- 모드 전환 탭: 검색 ↔ AI에게 질문하기 -->
    <div class="mode-tabs" id="mode-tabs">
      <button type="button" class="mode-tab active" data-mode="search">🔍 검색</button>
      <button type="button" class="mode-tab" data-mode="ask">💬 AI에게 질문하기</button>
    </div>

    <form id="search-form" class="search-box mode-panel" data-mode-panel="search" autocomplete="off">
      <input id="search-input" type="text" placeholder="검색어를 입력하세요. 예) 연구비, 휴학하려면 어떻게 해?" />
      <button type="submit" id="search-btn" aria-label="검색">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 5L20.49 19zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14"/></svg>
      </button>
    </form>

    <form id="ask-form" class="search-box mode-panel hidden" data-mode-panel="ask" autocomplete="off">
      <input id="ask-input" type="text" placeholder="질문을 입력하세요. 예) 휴학 신청은 언제까지 해야 해?" />
      <button type="submit" id="ask-btn" aria-label="질문하기">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
      </button>
    </form>

    <!-- 필터 영역 (검색/질문 모드 공통) -->
    <div class="filters">
      <div class="filter-group">
        <span class="filter-label">출처</span>
        <div class="chip-group" id="source-filters">
          <button type="button" class="chip active" data-value="">전체</button>
          <button type="button" class="chip" data-value="대학">대학</button>
          <button type="button" class="chip" data-value="산학협력단">산학협력단</button>
        </div>
      </div>
      <div class="filter-group">
        <span class="filter-label">카테고리</span>
        <div class="chip-group" id="category-filters">
          <button type="button" class="chip active" data-value="">전체</button>
          <!-- 자바스크립트로 /api/filters 결과를 채워 넣음 -->
        </div>
      </div>
    </div>
  </section>

  <!-- 상태 영역 (로딩 / 결과 요약 / 결과없음) - 검색 모드 -->
  <section class="status-area mode-panel" data-mode-panel="search" id="status-area"></section>

  <!-- 검색 결과 목록 - 검색 모드 -->
  <section class="results mode-panel" data-mode-panel="search" id="results"></section>

  <!-- AI 질문하기 모드: 채팅 형태 대화 영역 -->
  <section class="chat-area mode-panel hidden" data-mode-panel="ask" id="chat-area">
    <div class="chat-welcome">
      <div class="chat-welcome-icon">💬</div>
      <div>학사 규정, 산학협력단 규정에 대해 무엇이든 물어보세요.<br>
        AI가 관련 조항을 찾아 답변해드립니다. (예: "휴학 신청은 언제까지 해야 해?", "연구비는 어떻게 신청하나요?")</div>
    </div>
  </section>

</main>

<!-- 미리보기 모달 -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <button type="button" class="modal-close" id="modal-close" aria-label="닫기">&times;</button>
    <div class="modal-header">
      <span class="badge" id="modal-badge"></span>
      <h2 id="modal-title"></h2>
      <div class="modal-meta" id="modal-meta"></div>
    </div>
    <div class="modal-tabs">
      <button type="button" class="tab-btn active" id="tab-article">이 조항만</button>
      <button type="button" class="tab-btn" id="tab-full">규정 전문</button>
    </div>
    <div class="modal-body" id="modal-body">
      <div class="loading-spinner"></div>
    </div>
    <div class="modal-footer">
      <a id="modal-site-link" href="#" target="_blank" rel="noopener" class="btn-primary">
        관련 사이트로 이동 ↗
      </a>
    </div>
  </div>
</div>

<footer class="site-footer">
  <p>경상국립대학교 총무과 (055-772-0334) · 산학협력단 산학연구과 (055-772-0211)</p>
  <p class="footer-note">본 검색 서비스는 대학·산학협력단 규정 원문을 AI로 재구성한 것으로, 법적 효력은 원본 규정을 따릅니다.</p>
</footer>

<script src="app.js?v=13"></script>
</body>
</html>
